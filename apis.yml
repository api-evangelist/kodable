aid: kodable
name: Kodable
description: Kodable is a San Diego, California based educational technology company that makes
  self-guided coding, computer science, and digital literacy games for elementary school students in
  grades K-5. Its product line includes Kodable Basics (an introduction to programming concepts for
  pre-readers), Kodable Creator (game design and coding with AI-assisted tutoring), Kodable Typing
  (keyboarding practice), and Bug World (JavaScript and object-oriented programming). Kodable sells to
  elementary schools and districts as well as directly to parents, pairing the student games with a
  teacher dashboard, K-5 curriculum, lesson plans, and professional development. The company is a
  Student Privacy Pledge signatory and a member of the Student Data Privacy Consortium, and publishes
  a privacy center covering COPPA, its EULA, terms of service, and district Data Privacy Agreement
  review. Kodable was surfaced as a 500 Global portfolio company. As of this enrichment pass Kodable
  publishes no public API, developer portal, SDKs, or machine-readable API artifacts - it is a
  consumer and school facing application rather than an API provider.
